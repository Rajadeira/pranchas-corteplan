<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sem conexão — Pranchas Corteplan</title>
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/icon-48-v3.png" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        font-family:
          'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          Arial,
          sans-serif;
        background: #fafafa;
        color: #1f1f1f;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 480px;
        width: 100%;
        background: #ffffff;
        border: 1px solid #dcdcdc;
        border-radius: 12px;
        padding: 40px 32px;
        text-align: center;
        box-shadow: 0 4px 24px rgba(31, 31, 31, 0.08);
      }
      .icon-wrap {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 16px;
        background: #fff3ec;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .icon-wrap svg {
        width: 36px;
        height: 36px;
        stroke: #f2612a;
      }
      h1 {
        font-size: 20px;
        font-weight: 700;
        color: #1f1f1f;
        margin-bottom: 10px;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        color: #6b6b6b;
        margin-bottom: 8px;
      }
      .hint {
        font-size: 12px;
        color: #6b6b6b;
        margin-top: 18px;
        padding-top: 18px;
        border-top: 1px solid #e5e5e5;
      }
      .hint strong {
        color: #1f1f1f;
      }
      button {
        margin-top: 24px;
        background: #f2612a;
        color: #ffffff;
        border: none;
        border-radius: 8px;
        padding: 10px 24px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #d9531f;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon-wrap">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z"
          />
        </svg>
      </div>
      <h1>Sem conexão</h1>
      <p>
        Reconecte para usar o gerador de pranchas. O aplicativo precisa de internet para fazer
        login, salvar versões dos projetos e exportar PDFs.
      </p>
      <button onclick="location.reload()">Tentar novamente</button>
      <p class="hint">
        Dica: verifique se o <strong>Wi-Fi</strong> ou o <strong>dados móveis</strong> estão ativos.
      </p>
    </div>
  </body>
</html>
